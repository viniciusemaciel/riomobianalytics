version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: riomobianalytics-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: riomobianalytics2024
      MONGO_INITDB_DATABASE: riomobianalytics
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - riomobianalytics-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.14.0-community
    container_name: riomobianalytics-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/riomobianalytics2024
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
      NEO4J_dbms_memory_pagecache_size: 256m
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
      NEO4JLABS_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - riomobianalytics-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "riomobianalytics2024", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: riomobianalytics-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      MONGO_URI: mongodb://admin:riomobianalytics2024@mongodb:27017/
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: riomobianalytics2024
      MONGO_DB: riomobianalytics
      GTFS_DIR: ./data/gtfs/
      RECLAMACOES_FILE: ./data/1746/chamados_v2_com_stops_filtrado.csv
      BAIRROS_FILE: ./data/gtfs/Limite_de_Bairros.csv
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - riomobianalytics-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local

networks:
  riomobianalytics-network:
    driver: bridge
